[project]
name = "forging-sdk"
version = "0.1.0"
description = "SDK for building Forging plugins, modules, and extensions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.10.0",
    "tomli-w>=1.0",
    "jinja2>=3.1",
    "pytest>=8.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
dev = [
    "ruff>=0.6",
    "pytest-asyncio>=0.24",
    "mcp>=1.0",
]

[project.scripts]
forging = "forging_sdk.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forging_sdk"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
