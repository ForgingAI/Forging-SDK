# Reference Plugin: Haiku Poem Generator
#
# This is a working example plugin that demonstrates the full plugin
# lifecycle.  It registers a "haiku" content type that generates
# AI haiku poems via the Engine's text pipeline.
#
# To test:
#   1. Start the Forging API (the plugin auto-loads from this directory)
#   2. GET /api/plugins — verify "haiku-poem" appears
#   3. POST /api/generate { "prompt": "sunset over ocean", "media_type": "haiku" }
#   4. The post is generated using the haiku pipeline

[plugin]
name = "haiku-poem"
version = "1.0.0"
description = "Generate AI haiku poems — a three-line poem in 5-7-5 syllable format"
author = "Forging Team"
license = "MIT"
min_forging_version = "0.2.0"

[plugin.content_types.haiku]
pipeline_id = "social-text-gen-v1"
token_cost = 2
max_generation_time_s = 30
artifact_kinds = ["inline_text"]
description = "AI-generated haiku poem (5-7-5 syllable format)"

[plugin.frontend]
entry = "src/renderer.js"
content_types = ["haiku"]

[plugin.hooks]
events = ["post.created"]
handler = "haiku_hooks:on_event"
